name: Build and deploy Aseprite

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if a release asset for the latest version already exists
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 0 * * *'
  # push:
  #   branches:
  #     - master

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      version_info: ${{ steps.version_info.outputs.version_info }}
      should_build: ${{ steps.should_build.outputs.should_build }}
    steps:
      - name: Get latest version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data=$(gh api repos/aseprite/aseprite/releases/latest)
          latest_tag=$(jq -r '.tag_name' <<< "$data")
          download_url=$(jq -r '.assets[]
            | select(.name | test("Source\\.zip$"))
            | .browser_download_url' <<< "$data" | head -n1)
          version_info=$(jq -r '.body // ""' <<< "$data")

          if [ -z "$latest_tag" ] || [ -z "$download_url" ]; then
            echo "::error::Could not resolve the latest Aseprite version or source archive"
            exit 1
          fi

          {
            echo "latest_tag=$latest_tag"
            echo "download_url=$download_url"
            echo "version_info<<VERSION_INFO_EOF"
            echo "$version_info"
            echo "VERSION_INFO_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Should we start a new build?
        id: should_build
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.version_info.outputs.latest_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          asset="Aseprite-${LATEST_TAG}-macOS.zip"
          if [ "$FORCE" != "true" ] &&
             gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
            echo "$asset already exists, skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $LATEST_TAG."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-aseprite:
    name: Build Aseprite
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false

    steps:
      - name: (macOS) Install dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: (Linux) Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Download Aseprite source
        run: |
          set -euo pipefail
          curl -fL -o Aseprite-source.zip "${{ needs.check-version.outputs.download_url }}"
          unzip -q Aseprite-source.zip -d aseprite

      - name: Download the Skia version Aseprite expects
        run: |
          set -euo pipefail
          case "${{ runner.os }}-$(uname -m)" in
            macOS-arm64) skia_arch=arm64; osx_arch=arm64 ;;
            macOS-*)     skia_arch=x64;   osx_arch=x86_64 ;;
            Linux-x86_64) skia_arch=x64;  osx_arch="" ;;
            *)           skia_arch=arm64; osx_arch="" ;;
          esac

          # The Aseprite source archive ships the exact Skia revision it needs
          # (laf/misc/skia-tag.txt), so this keeps working across versions.
          skia_tag=$(tr -d '[:space:]' < aseprite/laf/misc/skia-tag.txt)
          skia_asset="Skia-${{ runner.os }}-Release-${skia_arch}.zip"
          url="https://github.com/aseprite/skia/releases/download/${skia_tag}/${skia_asset}"

          echo "Downloading $url"
          curl -fL -o skia.zip "$url"
          unzip -q skia.zip -d skia

          {
            echo "SKIA_ARCH=$skia_arch"
            echo "OSX_ARCH=$osx_arch"
          } >> "$GITHUB_ENV"

      - name: (macOS) Configure
        if: runner.os == 'macOS'
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$PWD/../skia" \
            -DSKIA_LIBRARY_DIR="$PWD/../skia/out/Release-$SKIA_ARCH"

      - name: (Linux) Configure
        if: runner.os == 'Linux'
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$PWD/../skia" \
            -DSKIA_LIBRARY_DIR="$PWD/../skia/out/Release-$SKIA_ARCH"

      - name: Build
        working-directory: aseprite
        run: ninja -C build aseprite

      - name: (macOS) Zip the app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd aseprite/build/bin
          rm -f gen modp_b64_gen
          ditto -c -k --sequesterRsrc --keepParent Aseprite.app \
            "$GITHUB_WORKSPACE/Aseprite-${ASEPRITE_TAG}-macOS.zip"
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}

      - name: (Linux) Zip the binaries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd aseprite/build/bin
          rm -f gen modp_b64_gen
          zip -r -y "$GITHUB_WORKSPACE/Aseprite-${ASEPRITE_TAG}-Linux.zip" .
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}

      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Release Aseprite ${{ needs.check-version.outputs.latest_tag }}
          body: ${{ needs.check-version.outputs.version_info }}
          draft: true
          prerelease: false
          files: Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
