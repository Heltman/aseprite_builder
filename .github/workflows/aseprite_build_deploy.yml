name: Build and deploy Aseprite

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if release assets for the latest version already exist
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 0 * * *'
  # push:
  #   branches:
  #     - master

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  # Assets checked by the "should we build" step.
  TARGETS: macOS Windows

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}
    steps:
      - name: Get latest version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data=$(gh api repos/aseprite/aseprite/releases/latest)
          latest_tag=$(jq -r '.tag_name' <<< "$data")
          download_url=$(jq -r '.assets[]
            | select(.name | test("Source\\.zip$"))
            | .browser_download_url' <<< "$data" | head -n1)
          jq -r '.body // ""' <<< "$data" > release-notes.md

          if [ -z "$latest_tag" ] || [ -z "$download_url" ]; then
            echo "::error::Could not resolve the latest Aseprite version or source archive"
            exit 1
          fi

          {
            echo "latest_tag=$latest_tag"
            echo "download_url=$download_url"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.version_info.outputs.latest_tag }}
        run: |
          set -euo pipefail
          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $LATEST_TAG already exists."
          else
            gh release create "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Release Aseprite $LATEST_TAG" \
              --notes-file release-notes.md
            echo "Created draft release $LATEST_TAG."
          fi

      - name: Should we start a new build?
        id: should_build
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.version_info.outputs.latest_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "Force requested, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          missing=""
          for os in $TARGETS; do
            asset="Aseprite-${LATEST_TAG}-${os}.zip"
            if ! grep -qx "$asset" <<< "$existing"; then
              missing="$missing $asset"
            fi
          done

          if [ -z "$missing" ]; then
            echo "All assets already exist, skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing:$missing"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: (macOS) Install dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: (Windows) Set up Ninja
        if: runner.os == 'Windows'
        uses: aseprite/get-ninja@main

      - name: (Windows) Set up MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download Aseprite source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o Aseprite-source.zip "${{ needs.check-version.outputs.download_url }}"
          unzip -q Aseprite-source.zip -d aseprite

      - name: Download the Skia version Aseprite expects
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-$(uname -m)" in
            macOS-arm64)  skia_arch=arm64; osx_arch=arm64 ;;
            macOS-*)      skia_arch=x64;   osx_arch=x86_64 ;;
            Windows-*)    skia_arch=x64;   osx_arch="" ;;
            *)            skia_arch=arm64; osx_arch="" ;;
          esac

          # The Aseprite source archive ships the exact Skia revision it needs
          # (laf/misc/skia-tag.txt), so this keeps working across versions.
          skia_tag=$(tr -d '[:space:]' < aseprite/laf/misc/skia-tag.txt)
          skia_asset="Skia-${{ runner.os }}-Release-${skia_arch}.zip"
          url="https://github.com/aseprite/skia/releases/download/${skia_tag}/${skia_asset}"

          echo "Downloading $url"
          curl -fL -o skia.zip "$url"
          unzip -q skia.zip -d skia

          {
            echo "SKIA_ARCH=$skia_arch"
            echo "OSX_ARCH=$osx_arch"
          } >> "$GITHUB_ENV"

      - name: (macOS) Configure
        if: runner.os == 'macOS'
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$PWD/../skia" \
            -DSKIA_LIBRARY_DIR="$PWD/../skia/out/Release-$SKIA_ARCH"

      - name: (Windows) Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S aseprite -B aseprite/build -G Ninja `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:GITHUB_WORKSPACE/skia" `
            -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE/skia/out/Release-x64"

      - name: Build
        working-directory: aseprite
        run: ninja -C build aseprite

      - name: (macOS) Zip the app bundle
        if: runner.os == 'macOS'
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          cd aseprite/build/bin
          rm -f gen modp_b64_gen
          ditto -c -k --sequesterRsrc --keepParent Aseprite.app \
            "$GITHUB_WORKSPACE/Aseprite-${ASEPRITE_TAG}-macOS.zip"

      - name: (Windows) Make the portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          cd aseprite/build/bin
          Remove-Item -ErrorAction SilentlyContinue `
            gen.exe, modp_b64_gen.exe, gen.exe.manifest, modp_b64_gen.exe.manifest
          Set-Content -Path aseprite.ini -Value '# This file is here so Aseprite behaves as a portable program'
          tar -a -c -f "$env:GITHUB_WORKSPACE/Aseprite-${env:ASEPRITE_TAG}-Windows.zip" *

      - name: Upload the asset to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          gh release upload "$ASEPRITE_TAG" \
            "Aseprite-${ASEPRITE_TAG}-${{ runner.os }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
